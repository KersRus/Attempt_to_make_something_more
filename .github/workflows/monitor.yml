name: Market Monitor

on:
  schedule:
    # Каждые 10 минут, с 06:00 до 23:59 по Москве
    - cron: '*/10 6-23 * * *'
      timezone: "Europe/Moscow"
  workflow_dispatch:  # ручной запуск для отладки

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build combined CA bundle
        run: |
          CERTIFI_PATH=$(python -c "import certifi; print(certifi.where())")
          cat "$CERTIFI_PATH" \
              russian_trusted_root_ca_pem.crt \
              russian_trusted_sub_ca_pem.crt \
              russian_trusted_sub_ca_2024_pem.crt > tbank_ca_bundle.pem
          echo "Total certificates in bundle:"
          grep -c "BEGIN CERTIFICATE" tbank_ca_bundle.pem

      - name: Run monitor
        env:
          TBANK_TOKEN: ${{ secrets.TBANK_TOKEN }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py
