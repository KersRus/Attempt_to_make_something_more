name: Market Monitor

on:
  schedule:
    - cron: '*/10 6-23 * * *'
      timezone: "Europe/Moscow"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Russian Trusted CA certificates
        run: |
          sudo cp russian_trusted_root_ca_pem.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp russian_trusted_sub_ca_pem.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo cp russian_trusted_sub_ca_2024_pem.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca_2024.crt
          sudo update-ca-certificates
          echo "=== Installed certificates ==="
          ls -la /usr/local/share/ca-certificates/

      - name: Run monitor
        env:
          TBANK_TOKEN: ${{ secrets.TBANK_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: python main.py
